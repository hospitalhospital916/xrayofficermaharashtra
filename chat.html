<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>चॅट प्रणाली - क्ष-किरण वैज्ञानिक अधिकारी संघटना</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* चॅट स्क्रीनसाठी क्लीन लेआउट */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e5ddd5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* १. व्हॉट्सॲपसारखा कॉम्पॅक्ट हेडर */
        .chat-header {
            background-color: #075e54;
            color: white;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 1000;
        }

        .chat-header-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header-info img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid white;
        }

        .user-title {
            font-size: 16px;
            font-weight: bold;
            margin: 0;
        }

        .user-sub {
            font-size: 11px;
            opacity: 0.8;
            margin: 0;
        }

        /* २. मेसेजेस स्क्रोलिंग एरिया */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message-bubble {
            max-width: 80%;
            background-color: white;
            padding: 10px 12px;
            border-radius: 12px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.15);
            position: relative;
        }

        .message-bubble.sent {
            align-self: flex-end;
            background-color: #dcf8c6;
        }

        .message-bubble.received {
            align-self: flex-start;
            background-color: white;
        }

        /* सदस्याचे नाव, फोटो, मोबाईल, कार्यक्षेत्र कार्ड */
        .sender-card {
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #eee;
            padding-bottom: 6px;
            margin-bottom: 6px;
        }

        .sender-card img {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            object-fit: cover;
        }

        .sender-details {
            font-size: 12px;
        }

        .sender-name {
            font-weight: bold;
            color: #075e54;
        }

        .sender-meta {
            color: #666;
            font-size: 10px;
        }

        .msg-time {
            font-size: 10px;
            color: #999;
            float: right;
            margin-top: 5px;
        }

        /* सीन स्टेटस (कोणी कोणी पाहिले) */
        .seen-by-badge {
            font-size: 11px;
            color: #0275d8;
            cursor: pointer;
            margin-top: 4px;
            display: inline-block;
        }

        /* ३. बॉटम इनपुट बार (पाठवा बटण - स्क्रीनच्या खाली फिक्स) */
        .chat-input-bar {
            background-color: #f0f0f0;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            position: sticky;
            bottom: 0;
            border-top: 1px solid #ccc;
        }

        .chat-input-bar input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 25px;
            outline: none;
            font-size: 14px;
        }

        .send-btn {
            background-color: #075e54;
            color: white;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        /* पपअप बॉक्स (Seen By) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 12px;
            width: 80%;
            max-width: 320px;
        }
    </style>
</head>
<body>

    <!-- १. सुटसुटीत टॉप हेडर -->
    <div class="chat-header">
        <div class="chat-header-info">
            <a href="index.html" style="color: white; text-decoration: none;"><i class="fas fa-arrow-left"></i></a>
            <img src="logo.png" alt="संघटना लोगो">
            <div>
                <p class="user-title">क्ष-किरण अधिकारी राज्य संघटना</p>
                <p class="user-sub">सदस्य चॅट ग्रुप</p>
            </div>
        </div>
        <a href="login.html" style="color: white; font-size: 12px; text-decoration: none;"><i class="fas fa-sign-out-alt"></i> बाहेर पडा</a>
    </div>

    <!-- २. चॅट मेसेजेस एरिया -->
    <div class="chat-messages" id="chatContainer">
        
        <!-- उदाहरण: समोरच्या सदस्याचा मेसेज -->
        <div class="message-bubble received">
            <div class="sender-card">
                <img src="hange_sir.jpg" alt="फोटो">
                <div class="sender-details">
                    <div class="sender-name">महेश शिवदास हांगे (सुपर ॲडमिन)</div>
                    <div class="sender-meta">📞 98xxxxxx00 | 📍 गडचिरोली</div>
                </div>
            </div>
            <div>सर्व सदस्यांनी नवीन नोंदणी लवकरात लवकर पूर्ण करावी.</div>
            <span class="msg-time">10:30 AM</span>
            <br>
            <span class="seen-by-badge" onclick="showSeenUsers()"><i class="fas fa-eye"></i> २ सदस्यांनी पाहिले</span>
        </div>

    </div>

    <!-- ३. तळाशी फिक्स असलेला इनपुट बार (Send Button) -->
    <div class="chat-input-bar">
        <input type="text" id="msgInput" placeholder="मेसेज टाईप करा...">
        <button class="send-btn" onclick="sendMessage()"><i class="fas fa-paperplane"></i>➤</button>
    </div>

    <!-- सीन युझर्स पॉपअप -->
    <div class="modal" id="seenModal">
        <div class="modal-content">
            <h3>हा मेसेज यांनी पाहिला:</h3>
            <ul style="padding-left: 20px; font-size: 14px;">
                <li>महेश हांगे (10:32 AM)</li>
                <li>किरण वैज्ञानिक (10:35 AM)</li>
            </ul>
            <button onclick="closeSeenModal()" style="margin-top:10px; padding: 5px 15px;">बंद करा</button>
        </div>
    </div>

    <script>
        function sendMessage() {
            var input = document.getElementById("msgInput");
            if(input.value.trim() !== "") {
                var container = document.getElementById("chatContainer");
                var msgHtml = `
                    <div class="message-bubble sent">
                        <div>${input.value}</div>
                        <span class="msg-time">आत्ताच</span>
                    </div>
                `;
                container.innerHTML += msgHtml;
                input.value = "";
                container.scrollTop = container.scrollHeight;
            }
        }

        function showSeenUsers() {
            document.getElementById("seenModal").style.display = "flex";
        }

        function closeSeenModal() {
            document.getElementById("seenModal").style.display = "none";
        }
    </script>
</body>
</html>
