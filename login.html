<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>लॉगिन - क्ष किरण संघटना</title>
  
  <!-- FontAwesome Icons for Eye Icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f7; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    
    .login-wrapper { background: white; padding: 40px 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 380px; text-align: center; border-top: 6px solid #0B3D91; position: relative; }
    
    .login-icon { background: #0B3D91; color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.8rem; margin: -70px auto 20px auto; box-shadow: 0 4px 10px rgba(11, 61, 145, 0.4); border: 4px solid white; }
    
    h2 { color: #0B3D91; margin-top: 0; margin-bottom: 5px; font-size: 1.6rem; }
    p.subtitle { color: #666; font-size: 0.9rem; margin-bottom: 25px; }

    .input-box { position: relative; margin-bottom: 20px; text-align: left; }
    .input-box i.input-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #888; }
    .input-box input { width: 100%; padding: 12px 15px 12px 40px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; outline: none; box-sizing: border-box; transition: 0.3s; }
    .input-box input:focus { border-color: #0B3D91; box-shadow: 0 0 8px rgba(11, 61, 145, 0.2); }
    
    /* Password Eye Icon */
    .toggle-password { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #888; }
    .toggle-password:hover { color: #0B3D91; }

    button { width: 100%; background: #0B3D91; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 1.1rem; cursor: pointer; font-weight: bold; transition: 0.3s; box-shadow: 0 4px 10px rgba(11, 61, 145, 0.2); }
    button:hover { background: #082a63; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(11, 61, 145, 0.3); }
    button:disabled { background: #999; cursor: not-allowed; transform: none; box-shadow: none; }

    .btn-google { background: #4285F4; color: white; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .btn-google:hover { background: #3367d6; }

    .divider { margin: 18px 0; text-align: center; position: relative; }
    .divider span { background: white; padding: 0 10px; color: #777; font-size: 0.85rem; font-weight: bold; }
    .divider hr { position: absolute; top: 50%; left: 0; right: 0; z-index: -1; margin: 0; border: 0; border-top: 1px solid #ccc; }

    #messageBox { margin-top: 15px; font-size: 0.95rem; font-weight: bold; min-height: 20px; }
    
    .extra-links { margin-top: 20px; font-size: 0.9rem; display: flex; justify-content: space-between; }
    .extra-links a { color: #0B3D91; text-decoration: none; font-weight: 600; }
    .extra-links a:hover { text-decoration: underline; }
    
    .register-link { display: block; margin-top: 20px; padding-top: 15px; border-top: 1px solid #eee; font-size: 0.9rem; color: #555; }
    .register-link a { color: #28a745; font-weight: bold; text-decoration: none; }
    .register-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-icon"><i class="fa-solid fa-user-lock"></i></div>
    <h2>लॉगिन पोर्टल</h2>
    <p class="subtitle">क्ष किरण वैज्ञानिक अधिकारी संघटना, महाराष्ट्र</p>

    <!-- Google Login Section -->
    <button type="button" class="btn-google" id="googleLoginBtn">
      <i class="fa-brands fa-google"></i> Google सह सुरक्षित लॉगिन करा
    </button>

    <div class="divider">
      <hr>
      <span>किंवा</span>
    </div>

    <!-- Email/Password Login Section -->
    <div class="input-box">
      <i class="fa-solid fa-envelope input-icon"></i>
      <input type="email" id="email" placeholder="ईमेल आयडी (Email)" required>
    </div>
    
    <div class="input-box">
      <i class="fa-solid fa-lock input-icon"></i>
      <input type="password" id="password" placeholder="पासवर्ड (Password)" required>
      <i class="fa-solid fa-eye toggle-password" id="togglePassword"></i>
    </div>

    <div class="extra-links">
      <label style="cursor:pointer;"><input type="checkbox"> मला लक्षात ठेवा</label>
      <a href="javascript:void(0)">पासवर्ड विसरलात?</a>
    </div>

    <button id="loginBtn" style="margin-top: 20px;">लॉगिन करा</button>
    <div id="messageBox"></div>

    <div class="register-link">
      नवीन सदस्य आहात? <a href="register.html">येथे नोंदणी करा</a>
    </div>
  </div>

  <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, signOut, setPersistence, browserLocalPersistence, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBVRXAra9pKpXbZYO4YkvbhuyWlKL8QVyk",
  authDomain: "xrayunionmah.firebaseapp.com",
  projectId: "xrayunionmah",
  storageBucket: "xrayunionmah.firebasestorage.app",
  messagingSenderId: "763805226978",
  appId: "1:763805226978:web:6bae81a0b6358b47d88bbb"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
setPersistence(auth, browserLocalPersistence).catch(console.error);

const $ = id => document.getElementById(id);
const msg = text => { $('messageBox').innerHTML = text; };
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const norm = v => String(v ?? '').trim().toLowerCase();

const togglePassword = $('togglePassword');
const passwordInput = $('password');
if (togglePassword && passwordInput) togglePassword.addEventListener('click', function(){
  const isPassword = passwordInput.type === 'password';
  passwordInput.type = isPassword ? 'text' : 'password';
  this.classList.toggle('fa-eye-slash', isPassword);
});

async function findByField(col, field, value) {
  try { return await getDocs(query(collection(db, col), where(field, '==', value))); }
  catch (_) { return { empty:true, docs:[] }; }
}

async function findMember(email) {
  let snap = await findByField('members','email',email);
  if (!snap.empty) return snap.docs[0];
  snap = await findByField('members','ईमेल',email);
  return snap.empty ? null : snap.docs[0];
}

async function findAdmin(email) {
  let snap = await findByField('admins','email',email);
  if (!snap.empty) return snap.docs[0];
  snap = await findByField('admins','ईमेल',email);
  return snap.empty ? null : snap.docs[0];
}

function memberBlocked(data) {
  const status = norm(data?.status || data?.स्थिती);
  const access = norm(data?.access || data?.अॅक्सेस);
  return status === 'pending' || status === 'प्रलंबित' || access === 'disabled' || access === 'बंद';
}

async function routeSignedInUser(user) {
  const email = norm(user.email);
  if (!email) throw new Error('ई-मेल उपलब्ध नाही.');

  const adminDoc = await findAdmin(email);
  if (email === 'hangemahesh498@gmail.com' || adminDoc) {
    if (adminDoc && adminDoc.data()?.isActive === false) throw new Error('ॲडमिन अकाउंट ब्लॉक केले आहे.');
    msg('<span style="color:green">✅ ॲडमिन लॉगिन यशस्वी! ॲडमिन पॅनेल उघडत आहे...</span>');
    setTimeout(() => location.replace('admin.html'), 350);
    return;
  }

  const memberDoc = await findMember(email);
  if (!memberDoc) throw new Error('हा ई-मेल सदस्य किंवा ॲडमिन खात्यात नोंदणीकृत नाही.');
  const data = memberDoc.data() || {};
  if (memberBlocked(data)) {
    if (norm(data.status || data.स्थिती) === 'pending' || norm(data.status || data.स्थिती) === 'प्रलंबित')
      throw new Error('तुमचा सदस्य अर्ज अजून ॲडमिनच्या मंजुरीच्या प्रतीक्षेत आहे.');
    throw new Error('तुमचा लॉगिन अॅक्सेस बंद आहे. ॲडमिनशी संपर्क साधा.');
  }
  msg('<span style="color:green">✅ सदस्य लॉगिन यशस्वी! डॅशबोर्ड उघडत आहे...</span>');
  setTimeout(() => location.replace('member-dashboard.html'), 350);
}

$('googleLoginBtn')?.addEventListener('click', async () => {
  const btn = $('googleLoginBtn'); btn.disabled = true;
  msg('<span style="color:#2563eb"><i class="fa-solid fa-spinner fa-spin"></i> Google ऑथेंटिकेशन होत आहे...</span>');
  try {
    const result = await signInWithPopup(auth, new GoogleAuthProvider());
    await routeSignedInUser(result.user);
  } catch (error) {
    await signOut(auth).catch(()=>{});
    msg('<span style="color:#dc2626">❌ ' + esc(error.message || 'Google लॉगिन अपयशी.') + '</span>');
  } finally { btn.disabled = false; }
});

$('loginBtn')?.addEventListener('click', async () => {
  const email = norm($('email')?.value);
  const password = $('password')?.value || '';
  const btn = $('loginBtn');
  if (!email || !password) { msg('<span style="color:#dc2626">⚠️ कृपया ईमेल आणि पासवर्ड टाका.</span>'); return; }
  btn.disabled = true;
  msg('<span style="color:#2563eb"><i class="fa-solid fa-spinner fa-spin"></i> सुरक्षित लॉगिन तपासत आहे...</span>');
  try {
    // सर्व सदस्यांसाठी एकच Firebase Authentication पद्धत.
    try {
      const cred = await signInWithEmailAndPassword(auth, email, password);
      await routeSignedInUser(cred.user);
      return;
    } catch (authError) {
      await signOut(auth).catch(()=>{});
      const code = authError?.code || '';
      const text = code.includes('invalid-credential') || code.includes('wrong-password') || code.includes('user-not-found')
        ? 'ईमेल किंवा पासवर्ड चुकीचा आहे.' : (authError.message || 'लॉगिन अयशस्वी.');
      throw new Error(text);
    }
  } catch (error) {
    msg('<span style="color:#dc2626">❌ ' + esc(error.message || 'लॉगिन अयशस्वी.') + '</span>');
  } finally { btn.disabled = false; }
});

// Forgot password link
const forgot = [...document.querySelectorAll('a')].find(a => a.textContent.includes('पासवर्ड विसरलात'));
forgot?.addEventListener('click', async (e) => {
  e.preventDefault(); const email = norm($('email')?.value);
  if (!email) return msg('<span style="color:#d97706">ℹ️ आधी ईमेल टाका, मग "पासवर्ड विसरलात?" पुन्हा दाबा.</span>');
  try { await sendPasswordResetEmail(auth,email); msg('<span style="color:green">✅ पासवर्ड रीसेट लिंक ईमेलवर पाठवली आहे.</span>'); }
  catch(e) { msg('<span style="color:#dc2626">❌ ' + esc(e.message) + '</span>'); }
});
</script>
</body>
</html>
