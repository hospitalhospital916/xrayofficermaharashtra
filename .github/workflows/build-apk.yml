name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Android App with Cordova
        run: |
          npm install -g cordova
          cordova create app com.portal.app "PortalApp"
          cd app
          rm -rf www/*
          # सर्व वेब फाइल्स ॲपमध्ये कॉपी करणे
          rsync -av --exclude='app' --exclude='.git' --exclude='.github' ../ ./www/
          cordova platform add android
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: portal-debug-apk
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
