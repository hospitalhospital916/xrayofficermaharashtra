name: Build X-Ray Union Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build native X-Ray Union APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          echo "X-Ray Union APK created successfully"

      - name: Upload X-Ray Union APK
        uses: actions/upload-artifact@v4
        with:
          name: xray-union-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
